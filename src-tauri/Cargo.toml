[package]
name = "msync"
description = "A unified desktop app that manages live streaming, bulk watermarking, and manages DSC crypto tokens for digital signing."
authors = ["Shirsendu Bairagi <shirsendu2001@gmail.com>"]
license = "MIT"
repository = "https://github.com/Modest-Human-Brands/msync"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
axum = "0.8"
hex = "0.4"
hostname = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-log = "2.9"
tauri-plugin-process = "2.3"
tauri-plugin-shell = "2.3"
tokio = { version = "1.53", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "fs", "set-header"] }
tauri-plugin-opener = "2.5"
tauri-plugin-fs = "2.5"
tauri-plugin-dialog = "2"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Certificates",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.11"