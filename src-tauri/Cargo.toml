[package]
name = "msync"
description = "A background media service that streams and mirrors assets between MMedia and MDrive, with automated folder-based reorganization and bulk watermark/logo stamping at scale"
authors = ["Shirsendu Bairagi <shirsendu2001@gmail.com>"]
license = "MIT"
repository = "https://github.com/Modest-Human-Brands/msync.git"
edition = "2021"

[lib]
name = "test_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.7"
hex = "0.4"
hostname = "0.4"
iroh = "1.0.3"
iroh-blobs = { version = "0.103", features = ["fs-store"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
thiserror = "2.0.20"
tokio = { version = "1.53", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Certificates",
] }